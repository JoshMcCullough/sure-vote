plugins {
    id 'java'
}

group = 'org.sure_vote'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':entity')
    implementation project(':repository')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'com.yubico:webauthn-server-core:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':api')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
tasks.register('postgresTest', Test) {
    description = 'Runs the service tests against PostgreSQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'surevote.store', 'postgres'
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('postgresTest')
}
