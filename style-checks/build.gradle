plugins {
    id 'java'
}

group = 'org.sure_vote'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'com.puppycrawl.tools:checkstyle:14.3.0'

    testImplementation 'com.puppycrawl.tools:checkstyle:14.3.0'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
